name: Encrypted vault tests

on:
  push:
    branches: [main, encrypted-vault, colab-vault]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vault:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install portable interface and test dependencies
        run: python -m pip install -r requirements/portable/requirements_nowheels.txt pytest pytest-asyncio ruff
      - name: Require native write isolation
        run: python -c 'from modules.vault_linux import landlock_abi; print("Landlock ABI", landlock_abi())'
      - name: Install Colab filesystem sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap libseccomp2 apparmor-profiles
          # Ubuntu's supplied profile permits bwrap's setup and restricts its
          # children. Keep the system-wide user-namespace restriction enabled.
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          else
            sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          fi
      - name: Download pinned native inference fixtures
        run: |
          curl --fail --location --retry 3 'https://github.com/oobabooga/llama-cpp-binaries/releases/download/v0.138.0/llama_cpp_binaries-0.138.0%2Bcpu-py3-none-linux_x86_64.whl' --output "$RUNNER_TEMP/llama-cpu.whl"
          curl --fail --location --retry 3 'https://huggingface.co/ggml-org/tiny-llamas/resolve/def3e2dd70df35ecbf6403ea347de4c5977220c1/stories260K.gguf' --output "$RUNNER_TEMP/stories260K.gguf"
          echo "0b3a0bdd21cf1684a47c269623c67300c815454647ec37f3217f6df054c00f59  $RUNNER_TEMP/llama-cpu.whl" | sha256sum --check
          echo "047bf46455a544931cff6fef14d7910154c56afbc23ab1c5e56a72e69912c04b  $RUNNER_TEMP/stories260K.gguf" | sha256sum --check
      - name: Test encrypted storage, gateway and native worker
        env:
          TEXTGEN_TEST_LLAMA_WHEEL: ${{ runner.temp }}/llama-cpu.whl
          TEXTGEN_TEST_LLAMA_MODEL: ${{ runner.temp }}/stories260K.gguf
        run: python -m pytest -q -rs tests/vault
      - name: Lint vault code
        run: |
          ruff check modules/vault_*.py modules/metadata_gguf.py modules/gguf_download.py tests/vault --output-format concise
          python -c 'import json; n = json.load(open("Colab-Encrypted-TextGen.ipynb")); print("\n\n".join("".join(c["source"]) for c in n["cells"] if c["cell_type"] == "code"))' | ruff check --select F821 -
      - name: Test dedicated Colab worker identity and native inference
        env:
          TEXTGEN_TEST_LLAMA_WHEEL: ${{ runner.temp }}/llama-cpu.whl
          TEXTGEN_TEST_LLAMA_MODEL: ${{ runner.temp }}/stories260K.gguf
        run: |
          # The dedicated worker cannot traverse the runner's private home.
          # Export only committed public source to a traversable test folder;
          # leave the runner home and checkout credentials private.
          COLAB_TEST_SOURCE="$(mktemp -d /tmp/textgen-colab-ci.XXXXXX)"
          git archive HEAD | tar -x -C "$COLAB_TEST_SOURCE"
          chmod 755 "$COLAB_TEST_SOURCE"
          cd "$COLAB_TEST_SOURCE"
          sudo --preserve-env=TEXTGEN_TEST_LLAMA_WHEEL,TEXTGEN_TEST_LLAMA_MODEL "$(command -v python)" -m pytest -q -rs tests/vault/test_colab.py::test_native_colab_filesystem_isolation 'tests/vault/test_linux.py::test_native_gateway_and_worker[colab]' 'tests/vault/test_native_libraries.py::test_fresh_llama_wheel_loads_and_generates[colab]'
